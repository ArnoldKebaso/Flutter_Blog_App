


name: blog_app
description: A simple Flutter blog application with Firebase backend.
publish_to: "none"     # Private project

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # --- State & DI ---
  provider: ^6.1.2

  # --- Firebase ---
  firebase_core: ^3.9.1
  firebase_auth: ^5.9.0
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.5.0

  # --- UI / Editing ---
  flutter_quill: ^9.3.10       # Rich-text editor
  image_picker: ^1.1.2         # Image uploads
  cached_network_image: ^3.3.1 # Fast image caching
  flutter_markdown: ^0.7.1     # Render posts on web

  # --- Utilities ---
  uuid: ^4.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/           # e.g. logo, placeholders
